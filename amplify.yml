version: 1
frontend:
  phases:
    preBuild:
      commands:
        - yarn install --frozen-lockfile
        - yarn prepare-data
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

customHeaders:
  # Parquet data — filenames are stable, but the dashboard appends a
  # `?v=<build>` token (from manifest.json) to every parquet URL, so caching
  # indefinitely is safe: a redeploy changes the token and busts the cache.
  # Two patterns: root-level derived globals and per-source / cdisc-ct files.
  - pattern: '/data/*.parquet'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
      - key: 'Content-Type'
        value: 'application/octet-stream'
  - pattern: '/data/**/*.parquet'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
      - key: 'Content-Type'
        value: 'application/octet-stream'

  # manifest.json is the cache-bust source of truth — it carries the `?v=`
  # token and the source list, so it must always revalidate.
  - pattern: '/data/manifest.json'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'

  # DuckDB-WASM binaries — large, uncompressed, cache forever.
  - pattern: '**/*.wasm'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
      - key: 'Content-Type'
        value: 'application/wasm'

  # Vite emits content-hashed filenames here, so immutable is safe.
  - pattern: '/assets/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'

  # index.html must always revalidate so clients pick up new asset hashes.
  - pattern: '/index.html'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
